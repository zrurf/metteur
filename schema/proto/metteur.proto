syntax = "proto3";

package metteur;

// The Metteur daemon service.
service Daemon {
  rpc ListOversightReports(OversightReportsRequest) returns (OversightReports);
  rpc GetConciergeState(ConciergeStateRequest) returns (ConciergeState);
  rpc SendConciergeMessage(SendConciergeMessageRequest) returns (stream ConciergeEvent);
  // Workspace management.
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (WorkspaceInfo);
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (Empty);
  rpc ListWorkspaces(Empty) returns (WorkspaceList);

  // Blueprint management.
  rpc SaveBlueprint(SaveBlueprintRequest) returns (Empty);
  rpc LoadBlueprint(LoadBlueprintRequest) returns (Blueprint);
  rpc ExecuteBlueprint(ExecuteBlueprintRequest) returns (stream ExecutionEvent);

  // Execution control.
  rpc CancelExecution(CancelRequest) returns (Empty);
  rpc PauseExecution(PauseRequest) returns (Empty);
  rpc ResumeExecution(ResumeRequest) returns (Empty);
  rpc SendInterrupt(InterruptRequest) returns (Empty);

  // Registry.
  rpc ListTools(RegistryRequest) returns (ToolList);

  // Configuration.
  rpc GetConfig(GetConfigRequest) returns (Config);
  rpc SetConfig(SetConfigRequest) returns (Empty);

  // Version management.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (SnapshotInfo);
  rpc ListSnapshots(ListSnapshotsRequest) returns (SnapshotList);
  rpc Rollback(RollbackRequest) returns (Empty);
  rpc GetFileHistory(GetFileHistoryRequest) returns (FileHistory);

  // Execution state management.
  rpc ListExecutions(ListExecutionsRequest) returns (ExecutionList);
  rpc ContinueExecution(ContinueExecutionRequest) returns (stream ExecutionEvent);
  rpc GetExecutionTree(GetExecutionTreeRequest) returns (ExecutionTree);

  // Audit log.
  rpc ListAuditLog(ListAuditLogRequest) returns (AuditLogList);

  // Sandbox approvals.
  rpc RespondApproval(ApprovalDecisionRequest) returns (Empty);

  // Usage and cost.
  rpc GetExecutionUsage(GetExecutionUsageRequest) returns (UsageSummary);
  // Redacted, bounded run facts; does not grant file or context access.
  rpc GetBlackboard(GetBlackboardRequest) returns (BlackboardProjection);

  // Registry.
  rpc ListNodeKinds(RegistryRequest) returns (NodeKindList);

  // MCP host.
  rpc ListMcpServers(RegistryRequest) returns (McpServerList);

  // Addon management.
  rpc InstallAddon(InstallAddonRequest) returns (AddonInfo);
  rpc ListAddons(ListAddonsRequest) returns (AddonList);
  rpc UninstallAddon(UninstallAddonRequest) returns (Empty);
  rpc SetAddonEnabled(SetAddonEnabledRequest) returns (Empty);

  // Blueprint function library.
  rpc SaveFunction(SaveFunctionRequest) returns (SaveFunctionResponse);
  rpc ListFunctions(ListFunctionsRequest) returns (FunctionList);
  rpc LoadFunction(LoadFunctionRequest) returns (LoadFunctionResponse);
  rpc DeleteFunction(DeleteFunctionRequest) returns (Empty);

  // Blueprint DSL.
  rpc CompileDsl(CompileDslRequest) returns (Blueprint);
  rpc DecompileBlueprint(DecompileBlueprintRequest) returns (DecompileDslResponse);

  // File operations (workspace-relative paths; `/.metteur` metadata is read-only).
  rpc ListFiles(ListFilesRequest) returns (FileList);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (Empty);
  rpc StatFile(StatFileRequest) returns (FileInfo);
  rpc CreateDir(CreateDirRequest) returns (Empty);
  rpc RemoveFile(RemoveFileRequest) returns (Empty);
  rpc RenameFile(RenameFileRequest) returns (Empty);
  // Opens the system file manager with the entry selected (best effort).
  rpc RevealInExplorer(RevealInExplorerRequest) returns (Empty);
  // Live file-change events for the workspace (created / modified / removed).
  rpc WatchWorkspace(WatchWorkspaceRequest) returns (stream WatchEvent);

  // Background commands (jobs) of the workspace.
  rpc ListJobs(ListJobsRequest) returns (JobList);
  rpc WatchJobs(WatchJobsRequest) returns (stream JobEvent);
  // Terminates one background command (a user action from the job panel).
  rpc KillJob(KillJobRequest) returns (KillJobResponse);

  // File content as recorded by a snapshot, for side-by-side diffs.
  rpc GetFileAtSnapshot(GetFileAtSnapshotRequest) returns (GetFileAtSnapshotResponse);

  // ReAct chat (one chat run per workspace at a time).
  rpc SendChat(SendChatRequest) returns (stream ChatEvent);
  rpc AbortChat(AbortChatRequest) returns (Empty);
  rpc ListChatSessions(ListChatSessionsRequest) returns (ChatSessionList);
  rpc GetChatSession(GetChatSessionRequest) returns (GetChatSessionResponse);
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (Empty);
  // Restores files and the complete pre-turn model/display state together.
  rpc RewindChat(RewindChatRequest) returns (GetChatSessionResponse);
}

message Empty {}

message OpenWorkspaceRequest {
  string path = 1;
}

message CloseWorkspaceRequest {
  string path = 1;
}

message WorkspaceInfo {
  string path = 1;
  bool locked = 2;
}

message WorkspaceList {
  repeated WorkspaceInfo workspaces = 1;
}

message SaveBlueprintRequest {
  string workspace_path = 1;
  Blueprint blueprint = 2;
  // Explicit authoritative file, relative to the workspace. Existing bindings may omit it.
  string file_path = 3;
  // Preserve the editor file representation; empty uses native blueprint JSON.
  string file_json = 4;
}

message LoadBlueprintRequest {
  string workspace_path = 1;
  string blueprint_id = 2;
}

message ExecuteBlueprintRequest {
  string workspace_path = 1;
  string blueprint_id = 2;
  // Optional canvas/native JSON asserting the saved graph the caller expects.
  // Save first: mismatched content cannot overwrite file authority or the mirror.
  string blueprint_json = 3;
}

message ExecutionEvent {
  string node_id = 1;
  string kind = 2; // started | finished | message | approval_request
  string message = 3;
  string detail_json = 4; // structured payload for approval_request / message
}

message CancelRequest {
  string workspace_path = 1;
  // Optional expected run identity; stale controls must not affect a replacement run.
  string run_id = 2;
}

message PauseRequest {
  string workspace_path = 1;
  // Optional expected run identity; stale controls must not affect a replacement run.
  string run_id = 2;
}

message ResumeRequest {
  string workspace_path = 1;
  // Optional expected run identity; stale controls must not affect a replacement run.
  string run_id = 2;
}

message InterruptRequest {
  string workspace_path = 1;
  string priority = 2; // Normal | Urgent | Emergency
  string message = 3;
}

message ToolInfo {
  string name = 1;
  string description = 2;
}

message ToolList {
  repeated ToolInfo tools = 1;
}

message GetConfigRequest {
  string workspace_path = 1;
}

message SetConfigRequest {
  string workspace_path = 1;
  string config_json = 2;
}

message Config {
  string config_json = 1;
  // Compatible presence-based layer offered for explicit migration/save.
  string overrides_json = 2;
  string effective_json = 3;
  bool legacy_format = 4;
  string defaults_json = 5;
}

message CreateSnapshotRequest {
  string workspace_path = 1;
  string description = 2;
  // Optional human-friendly alias used to reference the snapshot on rollback.
  string alias = 3;
}

message SnapshotInfo {
  string id = 1;
  string description = 2;
  int64 created_at = 3;
  string alias = 4;
}

message SnapshotList {
  repeated SnapshotInfo snapshots = 1;
}

message ListSnapshotsRequest {
  string workspace_path = 1;
}

message RollbackRequest {
  string workspace_path = 1;
  // Snapshot id used when `alias` is empty.
  string snapshot_id = 2;
  // Snapshot alias; mutually exclusive with `snapshot_id`.
  string alias = 3;
}

message GetFileHistoryRequest {
  string workspace_path = 1;
  string path = 2;
}

message FileHistoryEntry {
  string snapshot_id = 1;
  string description = 2;
  int64 created_at = 3;
  string status = 4; // Added | Modified | Deleted | Unchanged
  string content_hash = 5;
}

message FileHistory {
  repeated FileHistoryEntry entries = 1;
}

message ListExecutionsRequest {
  string workspace_path = 1;
}

message ExecutionInfo {
  string run_id = 1;
  string blueprint_id = 2;
  string status = 3; // Running | Suspended | Completed | Failed
  int64 started_at = 4;
  int64 updated_at = 5;
  int32 executed_nodes = 6;
  string data_json = 7;
}

message ExecutionList {
  repeated ExecutionInfo executions = 1;
}

message ContinueExecutionRequest {
  string workspace_path = 1;
  string run_id = 2;
}

message GetExecutionTreeRequest {
  string workspace_path = 1;
  string run_id = 2;
}

message ExecTreeNode {
  string id = 1;
  // run | node:<kind> | subagent | function:<name>
  string kind = 2;
  string label = 3;
  string parent = 4;
  repeated string children = 5;
  // running | done | failed:<reason>
  string status = 6;
  uint64 tokens = 7;
  int64 started_at = 8;
  int64 finished_at = 9; // 0 = still running
}

message ExecutionTree {
  repeated ExecTreeNode nodes = 1;
  repeated string roots = 2;
}

message ListAuditLogRequest {
  string workspace_path = 1; // empty = global audit
}

message AuditEntry {
  int64 timestamp = 1;
  string user_id = 2;
  string operation = 3;
  string detail_json = 4;
}

message AuditLogList {
  repeated AuditEntry entries = 1;
}

message ApprovalDecisionRequest {
  string workspace_path = 1;
  string request_id = 2;
  // AllowOnce | AllowRun | AllowWorkspace | AllowGlobal |
  // DenyOnce | DenyRun | DenyWorkspace | DenyGlobal
  string decision = 3;
}

message GetExecutionUsageRequest {
  string workspace_path = 1;
  string run_id = 2;
}

message ModelUsage {
  string model = 1;
  uint64 calls = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 reasoning_tokens = 5;
  uint64 cost_micros = 6;
  // Prompt-cache breakdown of input_tokens (0 when the provider reports none).
  uint64 cached_input_tokens = 7;
  uint64 cache_write_input_tokens = 8;
  // False for legacy, absent or partially reported counters.
  bool tokens_complete = 9;
  bool cache_complete = 10;
  // Configured-price estimates only; false when any call is unpriced.
  bool cost_complete = 11;
}

message UsageSummary {
  string oversight_json = 4;
  string currency = 1;
  uint64 total_cost_micros = 2;
  repeated ModelUsage models = 3;
}

message NodeKindList {
  // Retained for older clients. Only actual registered executor kinds appear.
  repeated string kinds = 1;
  repeated NodeKindInfo infos = 2;
  // Zero means a legacy daemon without pin metadata; currently version 1.
  uint32 signature_version = 3;
}

message NodeKindInfo {
  string kind = 1;
  string node_type = 2;
  // Contract pins have empty ids; clients assign fresh ids to node instances.
  repeated Pin pins = 3;
  string description = 4;
  bool dynamic_pins = 5;
  string addon_binding_json = 6;
}

message McpServerInfo {
  string owner = 5;
  string scope_root = 6;
  string name = 1;
  string status = 2; // Connected | Failed | Disabled
  uint32 tool_count = 3;
  string error = 4;
}

message McpServerList {
  repeated McpServerInfo servers = 1;
}

message InstallAddonRequest {
  // Path to a .zip package or an unpacked directory (development mode).
  string package_path = 1;
  // Empty = install into the global addon directory.
  string workspace_path = 2;
  repeated string granted_permissions = 3;
}

message RegistryRequest { string workspace_path = 1; }

message AddonInfo {
  string id = 1;
  string version = 2;
  string name = 3;
  string description = 4;
  bool enabled = 5;
  string scope = 6; // global | workspace
  repeated string required_permissions = 7;
  repeated string granted_permissions = 8;
  uint32 tool_count = 9;
  uint32 fragment_count = 10;
  string scope_root = 11;
  string fingerprint = 12;
  string status = 13;
  string error = 14;
  repeated AddonHookStatus hooks = 15;
}

message AddonHookStatus {
  string name = 1;
  string event = 2;
  string scope_root = 3;
  string event_id = 4;
  string status = 5;
  uint64 completed = 6;
  uint64 failed = 7;
  string error = 8;
}

message ListAddonsRequest {
  // Empty = list addons from all scopes.
  string workspace_path = 1;
}

message AddonList {
  repeated AddonInfo addons = 1;
}

message UninstallAddonRequest {
  string id = 1;
  string workspace_path = 2;
}

message SetAddonEnabledRequest {
  string id = 1;
  string workspace_path = 2;
  bool enabled = 3;
}

// ---- Blueprint function library -------------------------------------------

message FnPin {
  string name = 1;
  string data_type = 2;
  string description = 3;
  string default_json = 4; // JSON-serialized default value
  bool optional = 5;
}

message FunctionInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated FnPin inputs = 4;
  repeated FnPin outputs = 5;
  string source = 6; // builtin | global | workspace | addon (read-only)
  int64 updated_at = 7;
  string addon_binding_json = 8;
  string file_path = 9;
}

message SaveFunctionRequest {
  string workspace_path = 1; // empty = global library
  FunctionInfo info = 2;
  Blueprint body = 3;
  string import_from = 4; // explicit read-only addon -> editable workspace copy
  string file_path = 5; // required for import; existing bound path for later edits
  string expected_addon_binding_json = 6;
}

message SaveFunctionResponse { FunctionInfo info = 1; }

message ListFunctionsRequest { string workspace_path = 1; } // empty = global + builtin

message FunctionList { repeated FunctionInfo functions = 1; }

message LoadFunctionRequest {
  string workspace_path = 1;
  string name = 2;
}

message LoadFunctionResponse {
  FunctionInfo info = 1;
  Blueprint body = 2;
}

message DeleteFunctionRequest {
  string workspace_path = 1;
  string name = 2;
}

// ---- Blueprint DSL -----------------------------------------------------------

message CompileDslRequest { string source = 1; string workspace_path = 2; }

message DecompileBlueprintRequest {
  string workspace_path = 1;
  string blueprint_id = 2;
  // When set, decompiles this exact blueprint instead of the stored copy.
  // Lets clients export the live canvas without depending on the archive.
  Blueprint blueprint = 3;
}

message DecompileDslResponse { string source = 1; }

// ---- File operations --------------------------------------------------------

message ListFilesRequest {
  string workspace_path = 1;
  // Workspace-relative directory; empty = workspace root.
  string dir = 2;
}

message FileEntry {
  string name = 1;
  // Workspace-relative path of the entry.
  string path = 2;
  bool is_dir = 3;
}

message FileList {
  repeated FileEntry entries = 1;
}

message ReadFileRequest {
  string workspace_path = 1;
  string path = 2;
}

message ReadFileResponse {
  string content = 1;
}

message WriteFileRequest {
  string workspace_path = 1;
  string path = 2;
  string content = 3;
}

message StatFileRequest {
  string workspace_path = 1;
  string path = 2;
}

message FileInfo {
  string path = 1;
  bool is_dir = 2;
  int64 len = 3;
}

message CreateDirRequest {
  string workspace_path = 1;
  string path = 2;
}

message RemoveFileRequest {
  string workspace_path = 1;
  string path = 2;
}

message RenameFileRequest {
  string workspace_path = 1;
  string from = 2;
  string to = 3;
}

message RevealInExplorerRequest {
  // Workspace-relative path of the entry to reveal.
  string workspace_path = 1;
  string path = 2;
}

message WatchWorkspaceRequest {
  string workspace_path = 1;
}

message WatchEvent {
  // Workspace-relative path, using `/` as the separator.
  string path = 1;
  // One of: created | modified | removed.
  string kind = 2;
}

// ---- Background commands (jobs) ------------------------------------------------

message ListJobsRequest {
  string workspace_path = 1;
}

message JobInfo {
  string id = 1;
  string command = 2;
  // Working directory relative to the workspace root.
  string cwd = 3;
  // One of: running | exited | failed | killed.
  string state = 4;
  // Process exit code; -1 when the job did not exit with a code.
  int32 exit_code = 5;
  // Identifier of the run that started the job.
  string run_id = 6;
  uint64 started_at = 7;
  uint64 finished_at = 8;
  // Total output bytes produced (the retained buffer keeps only the tail).
  uint64 output_bytes = 9;
  // Trailing output, for a quick look without subscribing.
  string tail = 10;
}

message JobList {
  repeated JobInfo jobs = 1;
}

message WatchJobsRequest {
  string workspace_path = 1;
}

message JobEvent {
  string job_id = 1;
  // One of: started | output | finished.
  string kind = 2;
  // New output text for `output` events.
  string chunk = 3;
  // One of: running | exited | failed | killed.
  string state = 4;
  int32 exit_code = 5;
  // One-line summary for `started` and `finished` events.
  string summary = 6;
}

message KillJobRequest {
  string workspace_path = 1;
  string job_id = 2;
}

message KillJobResponse {
  // Whether a running job was asked to stop (false = already finished).
  bool killed = 1;
  // The job's state label after the request.
  string state = 2;
}

message GetFileAtSnapshotRequest {
  string workspace_path = 1;
  // Workspace-relative path.
  string path = 2;
  // Snapshot to read; empty means the most recent snapshot.
  string snapshot_id = 3;
}

message GetFileAtSnapshotResponse {
  // Whether the snapshot tracked this file (false = added since then).
  bool found = 1;
  string content = 2;
  // The snapshot actually read, empty when the workspace has none.
  string snapshot_id = 3;
}

// ---- ReAct chat ---------------------------------------------------------------

message SendChatRequest {
  string workspace_path = 1;
  string message = 2;
  // JSON array of `{role, content}` messages of the conversation so far.
  // Only consulted when creating a new session; persisted sessions are authoritative.
  string history_json = 3;
  // JSON object with model / temperature / top_p / max_tokens /
  // reasoning_effort / max_iterations. `retry: true` is an internal marker
  // requiring a non-empty persisted session; it must never seed a new context.
  string options_json = 4;
  // Empty = reuse the workspace's active session (create when none exists);
  // non-empty = resume that session (NotFound if unknown or mismatched).
  string session_id = 5;
}

message ChatEvent {
  // assistant_delta | assistant | tool | done | error | session
  string kind = 1;
  string content = 2;
  // Structured payload: tool name, model, usage, session id, error message.
  string detail_json = 3;
}

message AbortChatRequest {
  string workspace_path = 1;
}

message ListChatSessionsRequest {
  string workspace_path = 1;
}

message ChatSessionInfo {
  string session_id = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
  uint64 turns = 4;
  // First user message, truncated, for list display.
  string title = 5;
  // User + assistant message count for display.
  uint64 message_count = 6;
}

message ChatSessionList {
  repeated ChatSessionInfo sessions = 1;
}

message GetChatSessionRequest {
  string workspace_path = 1;
  string session_id = 2;
}

message GetChatSessionResponse {
  string session_id = 1;
  int64 created_at = 2;
  // JSON array of `{role, content}` (user/assistant only) for UI restore.
  string history_json = 3;
  // JSON array of the agent's task list at the end of the last turn.
  string todos_json = 4;
  // Display transcript (`[{role, at, content, ...}]`), which keeps the tool
  // calls, notices and errors that `history_json` cannot represent. Empty for
  // sessions written before it existed.
  string transcript_json = 5;
}

message DeleteChatSessionRequest {
  string workspace_path = 1;
  // Empty = delete the workspace's active session.
  string session_id = 2;
}

message RewindChatRequest {
  string workspace_path = 1;
  string session_id = 2;
  string snapshot_id = 3;
}

// Blueprint model mirrored from the shared crate.
message Blueprint {
  string id = 1;
  string name = 2;
  repeated Node nodes = 3;
  repeated Edge edges = 4;
  string entry_node_id = 5;
}

message Node {
  string id = 1;
  string node_type = 2;
  string kind = 3;
  float pos_x = 4;
  float pos_y = 5;
  repeated Pin pins = 6;
  string data_json = 7;
}

message Pin {
  string id = 1;
  string name = 2;
  string pin_type = 3;
  string data_type = 4;
  string default_json = 5; // JSON-serialized default value
  bool optional = 6;
  repeated string choices = 7;
  string description = 8;
  string key = 9; // Stable semantic key; both canvas and DSL reference pins by it
}

message Edge {
  string id = 1;
  string source_node = 2;
  string source_pin = 3;
  string target_node = 4;
  string target_pin = 5;
}

message GetBlackboardRequest {
  string workspace_path = 1;
  string run_id = 2;
  // {last_n, origins, status, keyword, entry_id}; limits are server enforced.
  string query_json = 3;
}
message BlackboardProjection {
  // JSON projection, containing only redacted summaries and opaque refs.
  string projection_json = 1;
}

message ConciergeStateRequest {
  string workspace_path = 1;
  string run_id = 2;
  string conversation_id = 3;
}
message ConciergeState { string state_json = 1; }
message SendConciergeMessageRequest {
  string workspace_path = 1;
  string run_id = 2;
  string conversation_id = 3;
  string message_id = 4;
  string message = 5;
}
message ConciergeEvent {
  string run_id = 1;
  string message_id = 2;
  string kind = 3;
  string detail_json = 4;
}

message OversightReportsRequest { string workspace_path = 1; string run_id = 2; }
message OversightReports { string reports_json = 1; }
