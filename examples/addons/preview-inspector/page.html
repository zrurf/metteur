<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Preview inspector</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#202024;background:#fff;font-size:13px;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:30px}h1{font-size:23px;font-weight:600;margin:8px 0 28px;letter-spacing:-.03em}h2{font-size:15px;font-weight:600}.eyebrow{font-size:10px;letter-spacing:.12em;color:#777780}button{font:inherit;border:0;background:#f2f2f6;border-radius:7px;padding:9px 14px;cursor:pointer}button.primary{background:#5454b5;color:white}button:disabled{opacity:.45;cursor:default}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.muted{color:#777780;line-height:1.7}.empty{padding:60px 12px;text-align:center}.tabs{display:flex;gap:24px;border-bottom:1px solid #e7e7ed;margin-top:26px;overflow:auto}.tabs button{background:none;border-radius:0;border-bottom:2px solid transparent;padding:12px 0;white-space:nowrap;color:#777780}.tabs button.active{color:inherit;border-color:currentColor}.check{display:flex;gap:12px;padding:17px 0;border-bottom:1px solid #eeeef2;font-size:12px}.check span:nth-child(2){flex:1}.note{padding:28px 0;line-height:1.8;min-height:150px}#error{color:#a74742;line-height:1.7;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:250px;overflow:auto;font-size:11px}html.dark{color:#e7e7eb;background:#19191d;color-scheme:dark}.dark button{background:#2b2b32;color:inherit}.dark button.primary{background:#6b6bc5}.dark .tabs,.dark .check{border-color:#33333b}@media(max-width:600px){body{padding:20px}.row{align-items:flex-start}.tabs{gap:18px}}summary{cursor:pointer;padding:12px 0;color:#777780}button:focus-visible{outline:2px solid #7777cc;outline-offset:3px}
</style></head><body><div class="row"><h1>Preview inspector</h1><button id="run" class="primary" disabled>Run checks</button></div><p id="target" class="muted">Choose a registered preview in the host selector.</p><p id="error" role="alert"></p><section id="empty" class="empty"><h2>Select a preview to begin</h2></section><section id="report" hidden><div class="row"><h2 id="report-title"></h2><span class="muted"><span id="check-status">Inspection ready</span></span></div><div class="tabs" id="tabs"><button class="active">Checks</button><button>Visual evidence</button><button>Console</button><button>Model opinion</button></div><div id="evidence"></div></section><script>
let port,selected,report,tab='Checks';const pending=new Map();const $=s=>document.querySelector(s);
function rpc(method,params={}){return new Promise((resolve,reject)=>{if(!port)return reject(Error('Host bridge unavailable'));const request_id=crypto.randomUUID();pending.set(request_id,{resolve,reject});port.postMessage({bridge_version:1,request_id,method,params});setTimeout(()=>{if(pending.has(request_id)){pending.delete(request_id);reject(Error('Host response timed out'))}},method==='inspect_selected'?65000:20000)})}
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
function scopeDetails(){const d=text('details','');d.append(text('summary','Inspection scope'),text('p',report.scope,'muted'));return d}
function render(){const box=$('#evidence');box.replaceChildren();if(!report)return;if(tab==='Checks'){for(const c of report.checks){const row=text('div','', 'check');row.append(text('span',c.passed?'✓':'△'),text('span',c.name),text('span',c.passed?'Pass':'Review','muted'));box.append(row)}box.append(scopeDetails())}else if(tab==='Visual evidence'&&report.screenshot?.mime==='image/jpeg'){
const figure=text('figure','');figure.style.margin='20px 0';const image=document.createElement('img');image.src='data:image/jpeg;base64,'+report.screenshot.base64;image.onload=()=>void rpc('resize',{height:Math.max(520,Math.min(1400,document.body.scrollHeight+30))});image.alt='Isolated rendering of the selected preview revision';image.style.cssText='width:100%;height:auto;border:1px solid #8884;border-radius:8px';figure.append(image,text('figcaption',`${report.screenshot.width} × ${report.screenshot.height} · viewport capture`,'muted'));box.append(figure,scopeDetails());
}else if(tab==='Model opinion'&&report.model_status==='completed'&&report.model_opinion){
const opinion=report.model_opinion;box.append(text('p',opinion.summary,'note'));for(const finding of opinion.findings||[])box.append(text('p',finding,'muted'));box.append(text('p',`${opinion.model} · ${opinion.scope}`,'muted'));
}else if(tab==='Console'&&report.console){
const entries=report.console.entries||[];box.append(text('p',entries.length?`${entries.length} captured entries`:'No console messages during the bounded capture.','muted'));for(const entry of entries){const row=text('div','', 'check');row.append(text('strong',entry.level),text('span',entry.message));box.append(row)}if(report.console.dropped)box.append(text('p',`${report.console.dropped} additional entries omitted`,'muted'));
}else{const descriptions={'Visual evidence':'No screenshot was captured. This report checks the selected source, not rendered layout.','Console':'No browser console capture is attached to this source-only inspection.','Model opinion':`Model review: ${report.model_status||'not_run'}. The host operator configures the model and its budget.`};box.append(text('div',tab==='Model opinion'?descriptions[tab]:(report.browser_error||descriptions[tab]),'note muted'))}}
async function refresh(){try{selected=await rpc('read_selected');report=null;$('#report').hidden=true;$('#empty').hidden=false;const ready=selected.target;$('#run').disabled=!ready;$('#target').textContent=ready?`${ready.title} · revision ${ready.revision}`:'Choose a registered preview in the host selector.'}catch(e){$('#error').textContent=String(e)}}
addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='metteur-addon-connect'||!e.ports[0]||port)return;port=e.ports[0];port.onmessage=ev=>{const m=ev.data;if(m.type==='target-changed'){void refresh();return}if(m.type==='theme'){document.documentElement.classList.toggle('dark',m.mode==='dark');return}const p=pending.get(m.request_id);if(!p)return;pending.delete(m.request_id);m.error?p.reject(Error(m.error)):p.resolve(m.result)};port.start();void refresh()});
$('#run').onclick=async()=>{const b=$('#run');b.disabled=true;b.textContent='Checking…';$('#error').textContent='';try{report=await rpc('inspect_selected');$('#empty').hidden=true;$('#report').hidden=false;$('#report-title').textContent=`${report.target.title} · revision ${report.target.revision}`;$('#check-status').textContent=report.browser_checks==='completed'?'Source + browser capture complete':'Source checks complete · browser '+report.browser_checks;render();await rpc('resize',{height:Math.max(520,Math.min(1400,document.body.scrollHeight+30))})}catch(e){$('#error').textContent=String(e)}finally{b.disabled=false;b.textContent='Run checks'}};
$('#tabs').onclick=e=>{if(e.target.tagName!=='BUTTON')return;tab=e.target.textContent;for(const b of $('#tabs').children)b.classList.toggle('active',b===e.target);render();void rpc('resize',{height:Math.max(520,Math.min(1400,document.body.scrollHeight+30))})};
</script></body></html>
