# CodeMirror extensions must share one state/view identity in types and runtime.
overrides:
  '@codemirror/state': 6.7.5
  '@codemirror/view': 6.43.12

# Scripts must not silently rewrite dependencies while another check is running.
# Install the frozen lockfile explicitly; stale dependencies produce an error.
verifyDepsBeforeRun: error
# Keep the same dependency layout in interactive shells and CI.
enableGlobalVirtualStore: false

allowBuilds:
  '@playwright/browser-chromium': true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/compiler-dom@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/compiler-sfc@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/compiler-ssr@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/compiler-vapor@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/reactivity@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/runtime-core@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/runtime-dom@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/runtime-vapor@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/server-renderer@3.6.0-rc.6 || 3.6.0-rc.9'
  - '@vue/shared@3.6.0-rc.6 || 3.6.0-rc.9'
  - vue@3.6.0-rc.6 || 3.6.0-rc.9
  - vue-echarts@8.2.0
